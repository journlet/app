server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # never cache the app shell or the service worker
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # hashed assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback, matching GitHub Pages rather than doing it the nginx way.
  #
  # try_files ... /index.html would serve the shell with a 200 for any unknown
  # path. Pages does something different: it serves 404.html, which the build
  # copies from index.html, with an HTTP 404 status. Same bytes, different
  # status, and the status is not cosmetic here: it is what a deep link and the
  # service worker's navigation fallback actually see. A rig whose whole purpose
  # is to catch a problem before it is pushed has to reproduce that.
  #
  # Deliberately no security headers, for the same reason. nginx is the one
  # place they could be set, and setting them here would make this container
  # disagree with production in the direction that hides problems.
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/ =404;
  }
}
