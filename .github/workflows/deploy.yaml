name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Gate the merge, not just the deploy. Without this, lint, tests and typecheck
  # ran only after a merge, as part of the deploy: main went red, Pages kept
  # serving the previous artifact, and the signal arrived from a failed run rather
  # than a blocked merge. That is not hypothetical: it happened on 4 August, and
  # the fix for it sat behind a broken main for as long as it took to notice.
  pull_request:
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions block, deliberately. One at this level applies
# to every job, which handed the build job, the job that executes ~486
# packages of dependency code, a token scoped to pages: write plus the ability
# to mint an OIDC identity token. For an app whose whole security model is
# "the JavaScript we serve you is honest", write access to the Pages
# deployment is the thing most worth stealing. So the capability lives only in
# the job that has no third-party code in it.
permissions: {}

concurrency:
  group: pages
  # A deployment is not a cancellable build. Two quick pushes cancelling an
  # in-flight deploy-pages step is worse than queueing behind it.
  cancel-in-progress: false

# Actions are pinned to commit SHAs, not tags. A tag is a movable pointer: a
# compromised or careless retag of v7 changes what runs here, and this workflow
# is the thing that publishes the JavaScript the whole encryption model trusts.
# The trailing comment is the human-readable version, and Dependabot rewrites
# both the SHA and the comment together, so pinning does not mean freezing.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts because no package in the tree defines preinstall,
      # install or postinstall today. That is worth making enforced rather than
      # incidental: a dependency that starts wanting one should fail here and be
      # looked at, not run quietly.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Separate from `npm run build`, which typechecks src only. tsc -b covers
      # the two referenced projects; tsconfig.test.json covers tests/, which
      # nothing typechecked at all until 4 August. Its own step so the log names
      # what broke rather than reporting it as a build failure.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    # Never on a pull request. The build above is what a PR wants; deploying one
    # would publish unmerged work to the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No `with: timeout:` here, and that is the finding rather than an
      # omission. deploy-pages caps the input at its 600000 ms default and says
      # so in a warning it is easy to miss: "timeout value is greater than the
      # allowed maximum - timeout set to the maximum of 600000 milliseconds".
      # Ten minutes is therefore a ceiling, not a default, and a Pages
      # deployment that has not started within it cannot be waited out from
      # here at all.
      #
      # That matters because of what the timeout costs. The action cancels the
      # deployment it created on the way out, Pages keys a deployment on the
      # commit SHA, and so re-running the job asks for something already
      # cancelled and fails in seconds. Recovery costs a new commit every time.
      #
      # Seen on 6 August: deploys went from 1m 39s the day before to 5m 53s,
      # 8m 22s, and then three ten-minute timeouts, every one of them
      # deployment_queued from start to abort with a healthy one-minute build
      # and a 401 KB single-file artifact. Nothing in this repository can
      # influence that. If it recurs the escalation is GitHub support, or
      # switching Pages to a branch source to bypass this API.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

