services:
  # Hot-reload dev server: docker compose up dev
  # → http://localhost:5173
  dev:
    image: node:22-alpine
    working_dir: /app
    # npm ci, not npm install. This container exists to check a change before
    # it is pushed, and npm install is free to resolve versions the lockfile
    # does not name, which is exactly the difference that would make the check
    # disagree with CI. The Dockerfile already uses ci for the same reason.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # keep container node_modules separate from the host's (macOS vs Linux binaries)
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Production build served by nginx: docker compose up web --build
  # → http://localhost:8080
  web:
    build: .
    ports:
      - "8080:80"
    profiles: ["web"]

volumes:
  node_modules:
