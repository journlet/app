<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy. The entire E2E model rests on the integrity of
      the JS running here, so lock script-src to self: no inline scripts, no
      remote script origins, so an injected string can never execute and read
      the keyring out of IndexedDB.

      style-src is 'self' with no 'unsafe-inline'. The old comment here said it
      was needed "because React writes element styles inline", which is not how
      the check works: React sets element styles through the CSSOM, and CSP
      governs <style> elements and style attributes as they are parsed, not
      CSSOM mutation. Verified rather than reasoned, on a real build with the
      directive removed: the app renders identically, twenty style attributes
      are still applied, the --grid custom property still resolves, and the
      browser reports no style-src violation. The one place it does bite is
      `vite dev`, which injects CSS as a runtime <style> element and so loses
      every rule to this directive; devCspAllowInlineStyles in vite.config.ts
      adds 'unsafe-inline' back for the dev server alone, and cannot touch
      what is built. It matters because with
      'unsafe-inline' present an HTML-injection foothold can exfiltrate through
      CSS attribute selectors, and "the keyring never leaves" is the whole
      claim. If a <style> element or a literal style="..." is ever added to
      markup, this is the directive that will refuse it, which is the point.

      connect-src is limited to the Supabase project (REST + realtime wss).
      The SUPABASE_ORIGINS token below is substituted at build time from
      SUPABASE_URL in src/lib/supabaseConfig.ts, by cspSupabaseOrigins in
      vite.config.ts (written without its percent signs here so the
      substitution does not rewrite this sentence as well). The
      host used to be written out here as well as there, and changing one and
      not the other broke sync silently, because the policy refuses the request
      before Supabase ever sees it and there is no server error to report. One
      source of truth instead. The substitution throws if this token is ever
      removed, so re-inlining the host fails the build rather than quietly
      restoring the trap.
      Fonts are self-hosted, so style-src and font-src are 'self' with no
      third-party origin anywhere in the policy: the Supabase project is now
      the only external host the app may reach, and it only ever receives
      ciphertext.
      form-action is 'none', not 'self': the app submits no forms at all, and
      the marketing site already uses 'none'. frame-src is 'none' because the
      app embeds nothing, and both directives work through meta.

      Delivered via meta because GitHub Pages cannot set response headers;
      frame-ancestors is header-only, so clickjacking cover needs a header
      or is accepted for the Pages deploy. Note the local nginx rig is not that
      header, deliberately: its job is to reproduce Pages, and Pages sends none.
      A meta CSP also does not reach the service worker, whose policy comes from
      its own response headers, so sw.js runs unrestricted on Pages regardless
      of anything in this tag.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' %SUPABASE_ORIGINS%; manifest-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      maximum-scale + user-scalable=no: the app is a fixed-viewport shell, not
      a scrolling document — pinch-zoom leaves it stranded off-centre with no
      way back, and iOS auto-zooms on focusing any input under 16px. Honoured
      by Chrome/Android; iOS Safari ignores it for accessibility, so the
      gesture listeners in main.tsx cover pinch there. Browser-level zoom
      (⌘+/-, desktop) is untouched and still works.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Two theme-colors, not one. This paints the chrome around the app (the
      Android status bar, the standalone PWA's title area), and a single cream
      value meant a dark-mode launch flashed cream before the app itself
      painted dark. The browser takes the first tag whose media matches, so
      light is listed first and there is deliberately no media-less fallback:
      one would always match and dark would never be reached. A browser that
      does not understand the media attribute treats both as applicable and
      takes the first, which is the cream it was already showing — no worse
      than before. Values track --paper in src/index.css; keep them in step.
    -->
    <meta name="theme-color" content="#F5F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191D23" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Journlet — the paper bullet journal, made digital. Offline-first and end-to-end encrypted."
    />
    <!-- Open Graph / social preview. Crawlers (LinkedIn, etc.) fetch these
         server-side, so og:image must be an absolute URL and reachable. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Journlet" />
    <meta property="og:title" content="Journlet" />
    <meta
      property="og:description"
      content="The paper bullet journal, made digital. Offline-first and end-to-end encrypted."
    />
    <meta property="og:url" content="https://app.journlet.com/" />
    <meta property="og:image" content="https://app.journlet.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Journlet — the paper bullet journal, made digital." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Journlet" />
    <meta
      name="twitter:description"
      content="The paper bullet journal, made digital. Offline-first and end-to-end encrypted."
    />
    <meta name="twitter:image" content="https://app.journlet.com/og-image.png" />
    <!-- Fonts are self-hosted (see @font-face in src/index.css). Preloaded
         because they are discovered late, inside the bundled stylesheet. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/public-sans-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fraunces-latin-opsz-normal.woff2"
      crossorigin
    />
    <title>Journlet</title>
  </head>
  <body>
    <!--
      Boot splash. #root is empty until the JS bundle has downloaded, parsed
      and executed, which on a phone is the second or two of white the app was
      showing before anything of ours appeared. This is the first thing the
      browser can paint: markup already in the document, needing only the
      stylesheet, which is a render-blocking <link> a fraction of the bundle's
      size and precached by the service worker after the first visit.

      The usual trick — inline the few critical rules in a <style> here — is
      not available: style-src is 'self' with no 'unsafe-inline' (see the CSP
      above), and that is worth more than the one saved request. So the rules
      live in src/index.css with everything else, and nothing here carries a
      style attribute. Same reason there is no inline script: main.tsx clears
      the splash, and cannot do it any earlier than it runs.

      This covers only the gap before React mounts. App then shows "opening
      journal…" while the encrypted journal loads out of IndexedDB, so the two
      states chain rather than overlap.

      The spinner runs from the first frame, and deliberately says nothing
      about why the wait is happening. An earlier version put a sentence here
      after eight seconds suggesting the reader check their connection, which
      is wrong in most cases it would fire in: the bundle is precached, so
      every launch after the first needs no network at all.

      role="status" so the wordmark is announced rather than the screen simply
      going quiet; the spinner itself is aria-hidden, being decoration.
    -->
    <div id="boot" class="boot" role="status">
      <p class="boot-mark">Journlet</p>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
